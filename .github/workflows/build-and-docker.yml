# Build the KEIT image and publish it to GitHub Container Registry.
#
# - Pull requests (including from forks): build only, nothing is pushed.
# - Release: a maintainer pushes a keit-v<version> tag on a commit in main.
#   Creating keit-v* tags is restricted to repository admins by a tag ruleset.
name: Build and Publish KEIT
on:
  pull_request:
    paths:
      - source/**
      - .github/workflows/build-and-docker.yml
  push:
    tags:
      - 'keit-v*'
permissions:
  contents: read
env:
  IMAGE_NAME: ghcr.io/aknostic/keit
jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: ./source
          platforms: linux/amd64
          push: false

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not point to a commit on main. Release only from main."
            exit 1
          fi

      - name: Determine image version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#keit-v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must look like keit-v<major>.<minor>.<patch>, got ${REF_NAME}."
            exit 1
          fi
          echo "Releasing version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./source
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/aknostic/keit
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
