# Build and publish the scaleway-footprint-exporter container image to GHCR.
#
# This is separate from build-and-docker.yml, which builds the unrelated root
# `keit` image.
# - Pull requests (including from forks): build only, nothing is pushed.
# - Release: a maintainer pushes a scaleway-footprint-exporter-v<version> tag
#   on a commit in main. Creating these tags is restricted to repository
#   admins by a tag ruleset.
name: Build and Publish scaleway-footprint-exporter

on:
  pull_request:
    paths:
      - scaleway-footprint-exporter/**
      - .github/workflows/build-scaleway-footprint-exporter.yml
  push:
    tags:
      - 'scaleway-footprint-exporter-v*'

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/aknostic/scaleway-footprint-exporter

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: ./scaleway-footprint-exporter
          platforms: linux/amd64
          push: false

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not point to a commit on main. Release only from main."
            exit 1
          fi

      - name: Determine image version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#scaleway-footprint-exporter-v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must look like scaleway-footprint-exporter-v<major>.<minor>.<patch>, got ${REF_NAME}."
            exit 1
          fi

          APP_VERSION=$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' scaleway-footprint-exporter/helm/Chart.yaml)
          if [[ "$APP_VERSION" != "$VERSION" ]]; then
            echo "::error::helm/Chart.yaml has appVersion '${APP_VERSION}', but the tag is ${VERSION}. Bump version and appVersion in Chart.yaml first."
            exit 1
          fi

          echo "Releasing version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Guard against overwriting an existing tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          REPO="aknostic/scaleway-footprint-exporter"

          TOKEN=$(curl -fsSL "https://ghcr.io/token?scope=repository:${REPO}:pull" | jq -r '.token' 2>/dev/null || true)

          if [[ -z "$TOKEN" || "$TOKEN" == "null" ]]; then
            echo "::warning::Could not obtain a GHCR pull token to check existing tags; proceeding without the guard."
            exit 0
          fi

          RESPONSE=$(curl -fsSL -H "Authorization: Bearer ${TOKEN}" "https://ghcr.io/v2/${REPO}/tags/list" 2>/dev/null || true)

          if [[ -z "$RESPONSE" ]]; then
            echo "::warning::Could not reach the GHCR tags API to check for an existing '${VERSION}' tag; proceeding without the guard."
            exit 0
          fi

          if echo "$RESPONSE" | jq -e --arg v "$VERSION" '(.tags // []) | index($v) != null' >/dev/null 2>&1; then
            echo "::error::Tag ${IMAGE_NAME}:${VERSION} already exists. Refusing to overwrite a published image; bump the version instead."
            exit 1
          fi

          echo "Tag ${VERSION} not found on GHCR; safe to publish."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./scaleway-footprint-exporter
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/aknostic/keit
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
