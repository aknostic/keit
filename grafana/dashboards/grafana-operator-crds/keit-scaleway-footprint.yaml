apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: keit-scaleway-footprint
  namespace: <your-grafana-operator-namespace>
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      # Set this to whatever your Grafana Operator GrafanaCR labels its instance with
      # See https://grafana.github.io/grafana-operator/docs/dashboards/
      <key>: <value>
  json: |
    {
      "title": "KEIT — Scaleway Environmental Footprint",
      "tags": [
        "keit",
        "sustainability",
        "scaleway",
        "carbon",
        "water",
        "reusable"
      ],
      "editable": true,
      "schemaVersion": 39,
      "refresh": "1h",
      "time": {
        "from": "now-30d",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "datasource": {
              "type": "prometheus",
              "uid": "${DS_PROMETHEUS}"
            },
            "definition": "label_values(keit_scaleway_co2_kg, kubernetes_cluster)",
            "includeAll": true,
            "allValue": ".+",
            "multi": true,
            "label": "Cluster",
            "name": "cluster",
            "query": "label_values(keit_scaleway_co2_kg, kubernetes_cluster)",
            "refresh": 2,
            "type": "query",
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            }
          },
          {
            "datasource": {
              "type": "prometheus",
              "uid": "${DS_PROMETHEUS}"
            },
            "definition": "label_values(keit_scaleway_co2_kg, project_name)",
            "includeAll": true,
            "allValue": ".+",
            "multi": true,
            "label": "Project",
            "name": "project",
            "query": "label_values(keit_scaleway_co2_kg, project_name)",
            "refresh": 2,
            "type": "query"
          },
          {
            "datasource": {
              "type": "prometheus",
              "uid": "${DS_PROMETHEUS}"
            },
            "definition": "label_values(keit_scaleway_co2_kg{project_name=~\"$project\"}, region)",
            "includeAll": true,
            "allValue": ".+",
            "multi": true,
            "label": "Region",
            "name": "region",
            "query": "label_values(keit_scaleway_co2_kg{project_name=~\"$project\"}, region)",
            "refresh": 2,
            "type": "query"
          }
        ]
      },
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 100,
          "title": "Yesterday's Footprint",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Total CO₂ equivalent for the previous full UTC day across selected projects/regions. Source: Scaleway Environmental Footprint API (ADEME-based).",
          "fieldConfig": {
            "defaults": {
              "unit": "kg",
              "decimals": 2,
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            }
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "expr": "sum(keit_scaleway_co2_kg{project_name=~\"$project\",region=~\"$region\"})",
              "refId": "A"
            }
          ],
          "title": "Total CO₂ (kg)",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Total water consumption for the previous full UTC day. Some Scaleway regions (e.g. WAW) report 0 — the API does not yet publish water data for every datacenter.",
          "fieldConfig": {
            "defaults": {
              "unit": "m3",
              "decimals": 3
            }
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "expr": "sum(keit_scaleway_water_m3{project_name=~\"$project\",region=~\"$region\"})",
              "refId": "A"
            }
          ],
          "title": "Total Water (m³)",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Rough equivalent in passenger-kilometres flown (122.72 gCO₂e/km, EU short-haul average). Comparative reference only.",
          "fieldConfig": {
            "defaults": {
              "unit": "lengthkm",
              "decimals": 0
            }
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 1
          },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "expr": "sum(keit_scaleway_co2_kg{project_name=~\"$project\",region=~\"$region\"}) * 1000 / 122.72",
              "refId": "A"
            }
          ],
          "title": "Flight km equivalent",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Distinct SKUs (Scaleway resource types) reporting any CO₂ for the selected scope.",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0
            }
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "expr": "count(count by (sku) (keit_scaleway_co2_kg{project_name=~\"$project\",region=~\"$region\"} > 0))",
              "refId": "A"
            }
          ],
          "title": "Active SKUs",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "id": 101,
          "title": "CO₂ Breakdowns (yesterday)",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "kg",
              "decimals": 3
            }
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 6
          },
          "id": 5,
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "values": [
                "value",
                "percent"
              ]
            },
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "expr": "sum by (service_category) (keit_scaleway_co2_kg{project_name=~\"$project\",region=~\"$region\"})",
              "legendFormat": "{{service_category}}",
              "refId": "A"
            }
          ],
          "title": "CO₂ by Service Category",
          "type": "piechart"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "kg",
              "decimals": 3,
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 80
              }
            }
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 6
          },
          "id": 6,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "expr": "sum by (region) (keit_scaleway_co2_kg{project_name=~\"$project\",region=~\"$region\"})",
              "legendFormat": "{{region}}",
              "refId": "A"
            }
          ],
          "title": "CO₂ by Region",
          "type": "barchart"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "kg",
              "decimals": 3
            }
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 14
          },
          "id": 7,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "expr": "topk(10, sum by (sku) (keit_scaleway_co2_kg{project_name=~\"$project\",region=~\"$region\"}))",
              "legendFormat": "{{sku}}",
              "refId": "A"
            }
          ],
          "title": "Top 10 SKUs by CO₂",
          "type": "barchart"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "kg",
              "decimals": 3
            }
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 14
          },
          "id": 8,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "expr": "sum by (project_name) (keit_scaleway_co2_kg{project_name=~\"$project\",region=~\"$region\"})",
              "legendFormat": "{{project_name}}",
              "refId": "A"
            }
          ],
          "title": "CO₂ by Project",
          "type": "barchart"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 22
          },
          "id": 102,
          "title": "Daily Trend",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "The exporter re-emits each day's value hourly; the trend appears as a step function with one new value per UTC day.",
          "fieldConfig": {
            "defaults": {
              "unit": "kg",
              "decimals": 3,
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 20,
                "lineInterpolation": "stepAfter"
              }
            }
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 23
          },
          "id": 9,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "expr": "sum(keit_scaleway_co2_kg{project_name=~\"$project\",region=~\"$region\"})",
              "legendFormat": "CO₂",
              "refId": "A"
            }
          ],
          "title": "Daily CO₂",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "m3",
              "decimals": 4,
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 20,
                "lineInterpolation": "stepAfter"
              }
            }
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 23
          },
          "id": 10,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "expr": "sum(keit_scaleway_water_m3{project_name=~\"$project\",region=~\"$region\"})",
              "legendFormat": "Water",
              "refId": "A"
            }
          ],
          "title": "Daily Water",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 31
          },
          "id": 103,
          "title": "Water Breakdowns (yesterday)",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "m3",
              "decimals": 4
            }
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 32
          },
          "id": 11,
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "values": [
                "value",
                "percent"
              ]
            },
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "expr": "sum by (service_category) (keit_scaleway_water_m3{project_name=~\"$project\",region=~\"$region\"})",
              "legendFormat": "{{service_category}}",
              "refId": "A"
            }
          ],
          "title": "Water by Service Category",
          "type": "piechart"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "m3",
              "decimals": 4,
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 80
              }
            }
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 32
          },
          "id": 12,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "expr": "sum by (region) (keit_scaleway_water_m3{project_name=~\"$project\",region=~\"$region\"})",
              "legendFormat": "{{region}}",
              "refId": "A"
            }
          ],
          "title": "Water by Region",
          "type": "barchart"
        }
      ],
      "__inputs": [
        {
          "name": "DS_PROMETHEUS",
          "label": "Prometheus / Mimir",
          "description": "Prometheus-compatible datasource (Mimir, Cortex, Thanos, or vanilla Prometheus) where the KEIT metrics are ingested.",
          "type": "datasource",
          "pluginId": "prometheus",
          "pluginName": "Prometheus"
        }
      ],
      "__requires": [
        {
          "type": "grafana",
          "id": "grafana",
          "name": "Grafana",
          "version": "9.0.0"
        },
        {
          "type": "datasource",
          "id": "prometheus",
          "name": "Prometheus",
          "version": "1.0.0"
        }
      ],
      "uid": "keit-scaleway-footprint"
    }
